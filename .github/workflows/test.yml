name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 shellcheck

      - name: Check Lua syntax
        run: luac5.1 -p init.lua

      - name: Run Lua tests
        run: lua5.1 test/init.test.lua

      - name: Check shell scripts
        run: shellcheck install.sh test/install.test.sh

      - name: Run installer test
        run: sh test/install.test.sh
